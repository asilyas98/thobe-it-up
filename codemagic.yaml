workflows:
  thobe-it-up-ios:
    name: Thobe It Up iOS App Store build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - thobe
      node: 22
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.simpleai.thobeitup
    scripts:
      - name: Install web and Capacitor dependencies
        script: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @capacitor/core@7 @capacitor/ios@7 @capacitor/cli@7
      - name: Build marketplace
        script: npm run build
      - name: Generate and sync iOS project
        script: |
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.js ] && [ ! -f capacitor.config.ts ]; then
            cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.simpleai.thobeitup",
            "appName": "Thobe It Up",
            "webDir": "dist",
            "ios": { "contentInset": "automatic", "preferredContentMode": "mobile" }
          }
          JSON
          fi
          if [ ! -d ios/App ]; then npx cap add ios; fi
          npx cap sync ios
          if [ -f assets/ios/AppIcon.png ]; then
            icon_set="ios/App/App/Assets.xcassets/AppIcon.appiconset"
            mkdir -p "$icon_set"
            cp assets/ios/AppIcon.png "$icon_set/AppIcon.png"
            cat > "$icon_set/Contents.json" <<'JSON'
          {
            "images": [{ "filename": "AppIcon.png", "idiom": "universal", "platform": "ios", "size": "1024x1024" }],
            "info": { "author": "xcode", "version": 1 }
          }
          JSON
          fi
      - name: Increment iOS build number
        script: |
          BUILD_VERSION=$((PROJECT_BUILD_NUMBER + 1))
          cd ios/App
          agvtool new-version -all "$BUILD_VERSION"
      - name: Apply signing profiles
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - build/ios/archive/*.xcarchive
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: NLV25X8A5S
        issuer_id: 18872f51-eb5b-49fc-bc34-d78bbb7d5a65
        submit_to_testflight: true